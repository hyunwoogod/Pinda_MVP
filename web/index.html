<!DOCTYPE html>
<html>

<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="my_location">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>my_location</title>
  <link rel="manifest" href="manifest.json">

  <script type="text/javascript"
    src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=ks8kik3aw8&submodules=geocoder"></script>

</head>

<body>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Flutter에서 호출할 수 있는 지오코딩 래퍼 함수 (Nominatim API 사용)
    window.naverGeocode = function (query, onSuccess, onError) {
      console.log('[Geocode] Searching for:', query);

      var url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(query) + '&format=json&accept-language=ko&countrycodes=kr&limit=5';

      fetch(url, {
        method: 'GET',
        headers: { 'User-Agent': 'PindaApp/1.0' }
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          console.log('[Geocode] Response:', data);
          var results = [];
          if (data && data.length > 0) {
            for (var i = 0; i < data.length; i++) {
              var item = data[i];
              results.push({
                address: item.display_name || '',
                latitude: parseFloat(item.lat) || 0,
                longitude: parseFloat(item.lon) || 0
              });
            }
          }
          onSuccess(JSON.stringify(results));
        })
        .catch(function (error) {
          console.error('[Geocode] Error:', error);
          onError('Geocode failed: ' + error.message);
        });
    };

    window.naverReverseGeocode = function (lat, lng, onSuccess, onError) {
      console.log('[ReverseGeocode] Coords:', lat, lng);

      var url = 'https://nominatim.openstreetmap.org/reverse?lat=' + lat + '&lon=' + lng + '&format=json&accept-language=ko';

      fetch(url, {
        method: 'GET',
        headers: { 'User-Agent': 'PindaApp/1.0' }
      })
        .then(function (response) { return response.json(); })
        .then(function (data) {
          console.log('[ReverseGeocode] Response:', data);
          var address = data.display_name || '';
          onSuccess(address);
        })
        .catch(function (error) {
          console.error('[ReverseGeocode] Error:', error);
          onError('Reverse geocode failed: ' + error.message);
        });
    };
    // 이벤트 객체에서 좌표 추출 헬퍼
    window.getNaverCoord = function (event) {
      if (!event || !event.coord) return null;
      try {
        var lat = 0, lng = 0;
        if (typeof event.coord.lat === 'function') {
          lat = event.coord.lat();
          lng = event.coord.lng();
        } else {
          lat = event.coord.y || event.coord._lat || 0;
          lng = event.coord.x || event.coord._lng || 0;
        }
        return JSON.stringify({ lat: lat, lng: lng });
      } catch (e) {
        console.error('getNaverCoord error:', e);
        return null;
      }
    };
  </script>
</body>

</html>
